<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a2b">
  <title>Victorian Council Boundaries</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101a2b;
      color: #edf4ff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 14% 0%, rgb(42 85 130 / 22%), transparent 36rem),
        #101a2b;
    }

    .page {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: clamp(16px, 3vw, 36px);
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      width: min(100%, 1440px);
      margin: 0 auto 20px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #78d5d0;
      font-size: 0.72rem;
      font-weight: 750;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      font-weight: 680;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 8px 0 0;
      color: #a9b8cc;
      font-size: 0.93rem;
    }

    .count {
      flex: 0 0 auto;
      padding: 9px 13px;
      border: 1px solid rgb(120 213 208 / 28%);
      border-radius: 999px;
      background: rgb(120 213 208 / 8%);
      color: #a6eeea;
      font-size: 0.83rem;
      font-weight: 650;
    }

    main {
      display: flex;
      flex: 1;
      flex-direction: column;
      width: min(100%, 1440px);
      min-height: 420px;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid rgb(184 207 235 / 14%);
      border-radius: 18px;
      background: #172438;
      box-shadow: 0 24px 70px rgb(0 0 0 / 28%);
    }

    #map {
      flex: 1;
      min-height: 420px;
      background: #dce7ec;
    }

    .map-footer {
      display: flex;
      min-height: 46px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 15px;
      color: #a9b8cc;
      font-size: 0.78rem;
    }

    #status {
      overflow-wrap: anywhere;
    }

    #status[data-state="error"] {
      color: #ffaaa7;
    }

    #fit-map {
      flex: 0 0 auto;
      padding: 7px 11px;
      border: 1px solid rgb(184 207 235 / 24%);
      border-radius: 8px;
      background: #22334b;
      color: #edf4ff;
      font: inherit;
      cursor: pointer;
    }

    #fit-map:hover {
      background: #2c4260;
    }

    #fit-map:focus-visible {
      outline: 2px solid #78d5d0;
      outline-offset: 2px;
    }

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: #172438;
      color: #edf4ff;
    }

    .leaflet-popup-content {
      min-width: 180px;
      margin: 13px 16px;
    }

    .popup-title {
      margin: 0 0 5px;
      font-size: 1rem;
      font-weight: 700;
    }

    .popup-subtitle {
      margin: 0;
      color: #a9b8cc;
      font-size: 0.82rem;
    }

    @media (max-width: 600px) {
      .page {
        padding: 16px 12px;
      }

      header {
        align-items: flex-start;
      }

      .count {
        padding: 7px 9px;
        font-size: 0.72rem;
      }

      main,
      #map {
        min-height: 60vh;
      }

      .map-footer {
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <p class="eyebrow">Victoria · Australia</p>
        <h1>Council boundaries</h1>
        <p class="subtitle">Explore local government areas across the state.</p>
      </div>
      <div class="count" id="count">Loading boundaries…</div>
    </header>

    <main>
      <div id="map" aria-label="Map showing Victorian council boundaries"></div>
      <div class="map-footer">
        <div id="status" role="status" aria-live="polite">Loading MapData.json…</div>
        <button id="fit-map" type="button">Fit all boundaries</button>
      </div>
    </main>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const map = L.map("map", {
      zoomControl: true,
      scrollWheelZoom: true
    });

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    const boundaryLayer = L.featureGroup().addTo(map);
    const status = document.getElementById("status");
    const count = document.getElementById("count");

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function showBoundary(record) {
      if (!Array.isArray(record.boundaries) || record.boundaries.length < 3) {
        throw new Error(`Boundary "${record.name || "unknown"}" has invalid coordinates.`);
      }

      const points = record.boundaries.map((point) => {
        if (
          !Array.isArray(point) ||
          point.length < 2 ||
          !Number.isFinite(point[0]) ||
          !Number.isFinite(point[1])
        ) {
          throw new Error(`Boundary "${record.name || "unknown"}" has invalid coordinates.`);
        }
        return [point[1], point[0]];
      });

      const polygon = L.polygon(points, {
        color: "#147f8a",
        weight: 1.5,
        opacity: 0.9,
        fillColor: "#48b8ad",
        fillOpacity: 0.19
      }).addTo(boundaryLayer);

      polygon.bindTooltip(escapeHtml(record.name || "Unnamed area"));
      polygon.bindPopup(
        `<h2 class="popup-title">${escapeHtml(record.data?.title || record.name || "Council area")}</h2>` +
        `<p class="popup-subtitle">${escapeHtml(record.name || "")}</p>`
      );
      polygon.on("mouseover", () => polygon.setStyle({ weight: 2.5, fillOpacity: 0.35 }));
      polygon.on("mouseout", () => polygon.setStyle({ weight: 1.5, fillOpacity: 0.19 }));
    }

    document.getElementById("fit-map").addEventListener("click", () => {
      if (boundaryLayer.getLayers().length > 0) {
        map.fitBounds(boundaryLayer.getBounds(), { padding: [18, 18] });
      }
    });

    async function loadBoundaries() {
      try {
        const response = await fetch("./MapData.json");
        if (!response.ok) {
          throw new Error(`Could not load MapData.json (HTTP ${response.status}).`);
        }

        const records = await response.json();
        if (!Array.isArray(records) || records.length === 0) {
          throw new Error("MapData.json does not contain any boundary records.");
        }

        records.forEach(showBoundary);
        map.fitBounds(boundaryLayer.getBounds(), { padding: [18, 18] });
        count.textContent = `${records.length} local government areas`;
        status.textContent = `Showing all ${records.length} boundaries. Select an area for its council name.`;
      } catch (error) {
        count.textContent = "Boundaries unavailable";
        status.dataset.state = "error";
        status.textContent = `${error.message} Serve this folder over HTTP (rather than opening index.html as a file) and check your internet connection.`;
        console.error("Failed to load council boundaries:", error);
      }
    }

    loadBoundaries();
  </script>
</body>
</html>
